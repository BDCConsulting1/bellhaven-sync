name: daily-bellhaven-sync
on:
  schedule:
    - cron: "15 11 * * *"   # 6:15 AM Eastern (11:15 UTC)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Restore review state
        uses: actions/cache@v4
        with:
          path: data/sync.db
          key: sync-db-${{ github.run_id }}
          restore-keys: sync-db-
      - name: Scrape, match, queue proposals (never writes to CRM)
        env:
          BELLHAVEN_TOKEN: ${{ secrets.BELLHAVEN_TOKEN }}
        run: python sync.py
